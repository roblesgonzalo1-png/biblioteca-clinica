<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca de Recursos Clínicos</title>
<style>
  :root{
    --bg:#f6f3ec; --ink:#2b2f2c; --muted:#6f766f;
    --sage:#5c7a63; --sage-dark:#3f5a46; --card-line:#e2ddd0; --accent:#c9744b;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif; }
  .sans{ font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; }

  #gate{ position:fixed; inset:0; background:var(--sage-dark); display:flex; align-items:center; justify-content:center; z-index:50; padding:24px; }
  #gate.hidden{ display:none; }
  .gate-box{ background:var(--bg); padding:40px 36px; border-radius:4px; max-width:380px; width:100%; text-align:center; }
  .gate-box h1{ font-size:1.5rem; margin:0 0 8px; }
  .gate-box p{ color:var(--muted); font-size:.92rem; margin:0 0 20px; }
  .gate-box input{ width:100%; padding:12px 14px; border:1px solid var(--card-line); border-radius:3px; font-size:1rem; margin-bottom:12px; }
  .gate-box button{ width:100%; padding:12px; background:var(--sage); color:#fff; border:none; border-radius:3px; font-size:.95rem; cursor:pointer; }
  .gate-box button:hover{ background:var(--sage-dark); }
  #gate-error{ color:var(--accent); font-size:.85rem; min-height:18px; margin-top:8px; }

  header{ padding:56px 24px 32px; max-width:1040px; margin:0 auto; border-bottom:1px solid var(--card-line); }
  header .eyebrow{ color:var(--muted); font-size:.85rem; margin-bottom:6px; }
  header h1{ font-size:2.4rem; margin:0 0 6px; color:var(--sage-dark); }
  header p{ color:var(--muted); margin:0; }
  #search{ margin-top:24px; width:100%; max-width:420px; padding:11px 14px; border:1px solid var(--card-line); border-radius:3px; font-size:.95rem; background:#fff; }

  main{ max-width:1040px; margin:0 auto; padding:32px 24px 80px; }
  #crumb{ font-size:.85rem; color:var(--muted); margin-bottom:20px; }
  #crumb button{ background:none; border:none; color:var(--sage-dark); cursor:pointer; font-family:inherit; font-size:inherit; padding:0; text-decoration:underline; }
  #crumb .sep{ margin:0 4px; }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:16px; }
  .card{ background:#fff; border:1px solid var(--card-line); border-radius:4px; padding:20px; cursor:pointer; transition:border-color .15s ease; }
  .card:hover{ border-color:var(--sage); }
  .card .icon{ width:38px; height:38px; border-radius:50%; background:var(--sage); color:#fff; display:flex; align-items:center; justify-content:center; font-size:1.1rem; margin-bottom:14px; }
  .card h3{ margin:0 0 4px; font-size:1.08rem; font-family:"Iowan Old Style",Georgia,serif; }
  .card .count{ color:var(--muted); font-size:.82rem; }

  .file-row{ display:flex; align-items:center; justify-content:space-between; background:#fff; border:1px solid var(--card-line); border-radius:4px; padding:14px 18px; margin-bottom:10px; cursor:pointer; }
  .file-row:hover{ border-color:var(--sage); }
  .file-row span.name{ font-size:.95rem; }
  .file-row span.tag{ font-size:.75rem; color:var(--muted); border:1px solid var(--card-line); border-radius:20px; padding:2px 10px; }

  .empty{ color:var(--muted); font-size:.9rem; padding:40px 0; text-align:center; }

  #viewer{ position:fixed; inset:0; background:rgba(43,47,44,.92); z-index:40; display:none; align-items:center; justify-content:center; padding:20px; }
  #viewer.open{ display:flex; }
  #viewer .frame{ background:#fff; width:100%; height:100%; max-width:900px; border-radius:4px; overflow:hidden; display:flex; flex-direction:column; }
  #viewer .frame .vhead{ padding:14px 20px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--card-line); }
  #viewer .frame .vhead h2{ font-size:1rem; margin:0; }
  #viewer .frame .vhead button{ background:none; border:none; font-size:1.4rem; cursor:pointer; color:var(--muted); }
  #viewer iframe{ flex:1; border:none; width:100%; }
</style>
</head>
<body class="sans">

<div id="gate">
  <div class="gate-box">
    <h1 style="font-family:Georgia,serif;">Biblioteca de Recursos</h1>
    <p>Ingresá la contraseña que recibiste por correo al comprar el acceso.</p>
    <input type="password" id="pw" placeholder="Contraseña">
    <button onclick="tryEnter()">Entrar</button>
    <div id="gate-error"></div>
  </div>
</div>

<header>
  <div class="eyebrow">BIBLIOTECA CLÍNICA</div>
  <h1 style="font-family:Georgia,serif;">Recursos para profesionales</h1>
  <p>Fichas, protocolos y herramientas organizadas por temática.</p>
  <input type="text" id="search" placeholder="Buscar carpeta o archivo…" oninput="onSearch(this.value)">
</header>

<main>
  <div id="crumb"></div>
  <div id="content"></div>
</main>

<div id="viewer">
  <div class="frame">
    <div class="vhead">
      <h2 id="viewer-title"></h2>
      <button onclick="closeViewer()">×</button>
    </div>
    <iframe id="viewer-frame"></iframe>
  </div>
</div>

<script>
/* ============================================================
   CONTRASEÑA — cambiá esto por la clave real de tus compradores
   ============================================================ */
const PASSWORD = "cambiar-esta-clave";

/* ============================================================
   ESTRUCTURA DE LA BIBLIOTECA (3 niveles, como tus carpetas)
   Cada nodo tiene "slug" (nombre EXACTO de la carpeta en GitHub,
   todo minúscula, sin espacios ni acentos) y:
   - "children": si es una carpeta que contiene más carpetas
   - "files": si es una carpeta final con archivos reales dentro
   El "path" completo se arma solo, uniendo los slugs del camino.
   Agregá tus archivos reales dentro de cada "files: []".
   Formato de archivo: { name:"Lo que ve el usuario", file:"nombre-exacto.pdf" }
   ============================================================ */
const LIBRARY = {
  "Recursos por temática": { icon:"🗂️", slug:"recursos-por-tematica", children:{
    "Ansiedad": { icon:"🌊", slug:"ansiedad", files:[] },
    "Depresión": { icon:"🌧️", slug:"depresion", files:[] },
    "Autoestima": { icon:"🌱", slug:"autoestima", files:[] },
    "Regulación emocional": { icon:"📱", slug:"regulacion-emocional", files:[] },
    "Trauma": { icon:"🧠", slug:"trauma", files:[] },
    "Estrés": { icon:"🍃", slug:"estres", files:[] },
    "TDAH": { icon:"⚡", slug:"tdah", files:[] },
    "TCA": { icon:"🍎", slug:"tca", files:[] },
    "TOC": { icon:"🔄", slug:"toc", files:[] },
    "Familia y vínculos": { icon:"🏠", slug:"familia-vinculos", files:[] }
  }},
  "Herramientas de sesión": { icon:"🧰", slug:"herramientas-de-sesion", children:{
    "Intervenciones terapéuticas": { icon:"🧩", slug:"intervenciones-terapeuticas", children:{
      "Técnicas DBT": { icon:"🌊", slug:"tecnicas-dbt", files:[] },
      "Técnicas TCC": { icon:"🍀", slug:"tecnicas-tcc", files:[] },
      "Mindfulness": { icon:"🧘", slug:"mindfulness", files:[] },
      "Técnicas ACT": { icon:"🌿", slug:"tecnicas-act", files:[] },
      "Neurociencias": { icon:"⚡", slug:"neurociencias", files:[] },
      "Psicología positiva": { icon:"🌈", slug:"psicologia-positiva", files:[] },
      "Terapia de esquemas": { icon:"🧱", slug:"terapia-de-esquemas", files:[] },
      "Terapia sistémica": { icon:"🕸️", slug:"terapia-sistemica", files:[] }
    }},
    "Evaluación": { icon:"📋", slug:"evaluacion", files:[] },
    "Protocolos": { icon:"📄", slug:"protocolos", files:[] },
    "Materiales de sesión": { icon:"🧳", slug:"materiales-de-sesion", children:{
      "Tareas para pacientes": { icon:"📝", slug:"tareas-para-pacientes", files:[] },
      "Fichas psicoeducación": { icon:"📄", slug:"fichas-psicoeducacion", files:[] },
      "Documento sesiones": { icon:"📁", slug:"documento-sesiones", files:[] },
      "Tareas y registros": { icon:"✅", slug:"tareas-y-registros", files:[] }
    }}
  }},
  "Kit infantil": { icon:"🙂", slug:"kit-infantil", children:{
    "TDAH": { icon:"⚡", slug:"tdah", files:[] },
    "Ansiedad": { icon:"🌊", slug:"ansiedad", files:[] },
    "Comportamiento": { icon:"🍀", slug:"comportamiento", files:[] },
    "Luto": { icon:"🦋", slug:"luto", files:[] },
    "Fichas de anamnesis": { icon:"📋", slug:"fichas-de-anamnesis", files:[] }
  }}
};

/* ------------------ lógica del sitio (no hace falta tocar esto) ------------------ */
function tryEnter(){
  const val = document.getElementById('pw').value;
  if(val === PASSWORD){
    sessionStorage.setItem('biblioteca-ok','1');
    document.getElementById('gate').classList.add('hidden');
  } else {
    document.getElementById('gate-error').textContent = "Contraseña incorrecta.";
  }
}
document.getElementById('pw').addEventListener('keydown', e=>{ if(e.key==='Enter') tryEnter(); });
if(sessionStorage.getItem('biblioteca-ok')==='1'){ document.getElementById('gate').classList.add('hidden'); }

let path = []; // array de nombres (claves) desde la raíz

function nodeAt(p){
  let node = { children: LIBRARY };
  for(const name of p){ node = node.children[name]; }
  return node;
}
function pathSlugs(p, extra){
  const slugs = p.map(name => nodeAt(p.slice(0,p.indexOf(name)+1)).slug);
  if(extra) slugs.push(extra);
  return slugs.join('/');
}

function render(){
  const content = document.getElementById('content');
  const crumb = document.getElementById('crumb');
  content.innerHTML = '';

  // breadcrumb
  let bc = `<button onclick="path=[];render();">Biblioteca</button>`;
  path.forEach((name,i)=>{ bc += `<span class="sep">/</span><button onclick="path=path.slice(0,${i+1});render();">${name}</button>`; });
  crumb.innerHTML = bc;

  const node = path.length ? nodeAt(path) : { children: LIBRARY };

  if(node.children){
    const grid = document.createElement('div');
    grid.className='grid';
    Object.entries(node.children).forEach(([name,child])=>{
      const count = child.children ? Object.keys(child.children).length + " carpetas" : child.files.length + " archivo" + (child.files.length===1?"":"s");
      const card = document.createElement('div');
      card.className='card';
      card.onclick=()=>{ path=[...path,name]; render(); };
      card.innerHTML = `<div class="icon">${child.icon}</div><h3>${name}</h3><div class="count">${count}</div>`;
      grid.appendChild(card);
    });
    content.appendChild(grid);
  } else {
    if(node.files.length===0){
      content.innerHTML = `<div class="empty">Todavía no hay archivos cargados en esta categoría.</div>`;
      return;
    }
    node.files.forEach(f=>{
      const row = document.createElement('div');
      row.className='file-row';
      row.onclick=()=>openViewer(f.name, `files/${pathSlugs(path,f.file)}`);
      row.innerHTML = `<span class="name">${f.name}</span><span class="tag">Ver</span>`;
      content.appendChild(row);
    });
  }
}

function openViewer(name, filePath){
  document.getElementById('viewer-title').textContent = name;
  document.getElementById('viewer-frame').src = filePath;
  document.getElementById('viewer').classList.add('open');
}
function closeViewer(){
  document.getElementById('viewer').classList.remove('open');
  document.getElementById('viewer-frame').src = '';
}

function walkAll(node, trail, cb){
  if(node.files){ node.files.forEach(f=>cb(f, trail)); }
  if(node.children){ Object.entries(node.children).forEach(([name,child])=>walkAll(child,[...trail,name],cb)); }
}

function onSearch(q){
  q = q.trim().toLowerCase();
  if(!q){ render(); return; }
  path = [];
  const content = document.getElementById('content');
  document.getElementById('crumb').innerHTML = '';
  content.innerHTML = '';
  let found = false;
  walkAll({children:LIBRARY}, [], (f, trail)=>{
    if(f.name.toLowerCase().includes(q) || trail.join(' ').toLowerCase().includes(q)){
      found = true;
      const row = document.createElement('div');
      row.className='file-row';
      row.onclick=()=>openViewer(f.name, `files/${pathSlugs(trail,f.file)}`);
      row.innerHTML = `<span class="name">${f.name} <span style="color:var(--muted)">— ${trail.join(' / ')}</span></span><span class="tag">Ver</span>`;
      content.appendChild(row);
    }
  });
  if(!found) content.innerHTML = `<div class="empty">Sin resultados para "${q}".</div>`;
}

render();
</script>
</body>
</html>
